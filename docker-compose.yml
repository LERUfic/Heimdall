version: '3.8'

services:
  heimdall:
    build: .
    container_name: heimdall_app
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Point SQLite strictly towards the mounted volume so request history survives restarts
      - DATABASE_URL=file:/app/data/production.db
      - JWT_SECRET=change_this_to_a_secure_random_string_for_production
      - MOCK_LDAP=true
      
      # Uncomment and fill out to enable Active Directory LDAP in production!
      # - LDAP_URL=ldap://your-server:389
      # - LDAP_BIND_DN=cn=admin,dc=example,dc=com
      # - LDAP_BIND_PASSWORD=password
      # - LDAP_SEARCH_BASE_DNS=dc=example,dc=com
      # - LDAP_USERNAME_ATTRIBUTE=sAMAccountName
      # - APPROVERS=admin,john.doe
    
    volumes:
      # Mounts the persistent volume internally to `/app/data` where SQLite writes.
      - heimdall_database:/app/data

volumes:
  heimdall_database:
    name: heimdall_sqlite_volume
